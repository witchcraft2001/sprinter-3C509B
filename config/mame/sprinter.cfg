<?xml version="1.0"?>
<!-- Deterministic input/view profile for the Stage 3 MAME launcher. -->
<mameconfig version="10">
    <system name="sprinter">
        <input>
            <keyboard tag=":" enabled="0" />
            <keyboard tag=":kbd:ms_naturl" enabled="1" />
            <!-- Serial mouse is player 3; bind it to the first host mouse. -->
            <port tag=":rs232:microsoft_mouse:X" type="P3_MOUSE_X" mask="4095" defvalue="0" sensitivity="60">
                <newseq type="standard">MOUSECODE_1_XAXIS</newseq>
                <newseq type="increment">MOUSECODE_1_XAXIS_NEG_SWITCH</newseq>
                <newseq type="decrement">MOUSECODE_1_XAXIS_POS_SWITCH</newseq>
            </port>
            <port tag=":rs232:microsoft_mouse:Y" type="P3_MOUSE_Y" mask="4095" defvalue="0" sensitivity="60">
                <newseq type="standard">MOUSECODE_1_YAXIS</newseq>
                <newseq type="increment">MOUSECODE_1_YAXIS_NEG_SWITCH</newseq>
                <newseq type="decrement">MOUSECODE_1_YAXIS_POS_SWITCH</newseq>
            </port>
        </input>
        <video>
            <target index="0" view="Screen 0 Standard (4:3)" />
        </video>
    </system>
</mameconfig>
