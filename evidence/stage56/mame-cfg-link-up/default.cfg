<?xml version="1.0"?>
<!-- Preserve the original launcher UI toggle while using an isolated cfg dir. -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="UI_TOGGLE_UI">
                <newseq type="standard">
                    KEYCODE_LCONTROL KEYCODE_DEL
                </newseq>
            </port>
        </input>
    </system>
</mameconfig>
